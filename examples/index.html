<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Impulse3D — interactive demos</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(20, 24, 33, 0.82);
        --accent: #88c0d0;
        --text: #e5e9f0;
        --muted: #8f9bb3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(320px, calc(100vw - 32px));
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        user-select: none;
      }

      #hud[hidden] {
        display: none;
      }

      #hud h1 {
        margin: 0 0 2px;
        font-size: 16px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      #hud .subtitle {
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
      }

      #demos {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }

      #demos button {
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      #demos button:hover {
        border-color: var(--accent);
      }

      #demos button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #10151d;
        font-weight: 600;
      }

      #description {
        margin: 0 0 10px;
        font-size: 12.5px;
        color: var(--text);
      }

      #stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin: 0 0 10px;
        padding: 8px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      #stats div {
        text-align: center;
      }

      #stats dt {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #stats dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
      }

      .hint {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
      }

      kbd {
        padding: 0 4px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(255, 255, 255, 0.06);
        font: inherit;
        font-size: 10.5px;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <section id="hud">
      <h1>Impulse3D</h1>
      <p class="subtitle">Sequential-impulse rigid body engine · Phase 5 demos</p>
      <nav id="demos" aria-label="Demos"></nav>
      <p id="description"></p>
      <dl id="stats">
        <div><dt>fps</dt><dd id="stat-fps">–</dd></div>
        <div><dt>bodies</dt><dd id="stat-bodies">–</dd></div>
        <div><dt>contacts</dt><dd id="stat-contacts">–</dd></div>
        <div><dt>step</dt><dd id="stat-step">–</dd></div>
      </dl>
      <p class="hint">
        Drag a body to pull it · <kbd>P</kbd> pause · <kbd>R</kbd> reset ·
        <kbd>B</kbd> debug overlay · <kbd>H</kbd> hide panel
      </p>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
